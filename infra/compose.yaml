name: nexus-v2-local

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: nexus_v2_dev
      POSTGRES_USER: nexus_v2_dev
      POSTGRES_PASSWORD: nexus_v2_dev_local_only
    ports:
      - '127.0.0.1:${NEXUS_LOCAL_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username nexus_v2_dev --dbname nexus_v2_dev']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    labels:
      com.nexus-v2.project: nexus-v2-local
      com.nexus-v2.scope: local-development

  temporal:
    image: temporalio/temporal:1.8.2
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
      - --namespace
      - nexus-v2-local
      - --ui-disable-news-fetch
    ports:
      - '127.0.0.1:${NEXUS_LOCAL_TEMPORAL_GRPC_PORT:-7233}:7233'
      - '127.0.0.1:${NEXUS_LOCAL_TEMPORAL_UI_PORT:-8233}:8233'
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test:
        [
          'CMD',
          'temporal',
          'operator',
          'namespace',
          'describe',
          '--namespace',
          'nexus-v2-local',
          '--address',
          'localhost:7233',
        ]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    labels:
      com.nexus-v2.project: nexus-v2-local
      com.nexus-v2.scope: local-development

volumes:
  postgres-data:
    name: nexus-v2-local-postgres-data
    labels:
      com.nexus-v2.project: nexus-v2-local
      com.nexus-v2.scope: local-development
  temporal-data:
    name: nexus-v2-local-temporal-data
    labels:
      com.nexus-v2.project: nexus-v2-local
      com.nexus-v2.scope: local-development
